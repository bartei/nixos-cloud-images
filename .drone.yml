kind: pipeline
type: docker
name: build-nixos-qcow2

trigger:
  event:
    - push

steps:
  - name: install-nix
    image: debian:bullseye-slim
    commands:
      - apt-get update && apt-get install -y curl bash
      - sh <(curl -L https://nixos.org/nix/install) --no-daemon
      - . /root/.nix-profile/etc/profile.d/nix.sh
      - nix-env -iA nixos.nixos-generators
      - mkdir -p /drone/src/nixos-cloud-image
      - nixos-generate -f qcow2 -c /drone/src/configuration.nix -o /drone/src/nixos-cloud-image

    # Cache the Nix store to speed up subsequent builds
    volumes:
      - name: nix-store
        path: /nix/store

#  - name: upload-image
#    image: plugins/s3
#    settings:
#      bucket: your-s3-bucket-name
#      access_key: your-access-key
#      secret_key: your-secret-key
#      source: /drone/src/nixos-cloud-image/nixos.qcow2
#      target: images/nixos.qcow2

volumes:
  - name: nix-store
    host:
      path: /nix/store