stages:
  - release
  - build

release:
  image: python:3.13
  stage: release
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $GL_TOKEN
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - pip install uv
    - uv pip install --system python-semantic-release==10.3.1
  script:
    - printenv
    - git checkout "$CI_COMMIT_REF_NAME"
    - semantic-release -vv version

  except:
    changes:
      - pyproject.toml
      - CHANGELOG.md

build:
  image: nixos/nix
  stage: build
  tags:
    - shell

  only:
    refs:
      - tags

  variables:
    IMAGE_NAME: nixos-25.05
    PRIVATE_KEY: $ID_ED25519
    PUBLIC_KEY: $ID_ED25519_PUB
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

  script:
    - echo "Build!"
    - printenv
    - mkdir -p /root/.ssh
    - echo "$PRIVATE_KEY" > /root/.ssh/id_ed25519
    - echo "$PUBLIC_KEY" > /root/.ssh/id_ed25519.pub
    - |
      cat <<EOF > /root/.ssh/config
      Host cloud-images.opt.provvedo.com
          UserKnownHostsFile=/dev/null
          StrictHostKeyChecking=no   
          IdentityFile /root/.ssh/id_ed25519
          User default
      EOF
    - chmod 600 /root/.ssh/id_ed25519
    - chmod 644 /root/.ssh/id_ed25519.pub
    - chmod 600 /root/.ssh/config
    - export CURRENT_DATE=$(date +%Y-%m-%d)
    # Debug SSH setup
    - echo "SSH config contents:"
    - cat /root/.ssh/config
    - echo "SSH key fingerprint:"
    - ssh-keygen -lf ~/.ssh/id_ed25519.pub
    # Test SSH connection with verbose output
    - ssh -F /root/.ssh/config -v -o ConnectTimeout=10 default@cloud-images.opt.provvedo.com 'echo "SSH connection test successful"'
    - nix --extra-experimental-features nix-command --extra-experimental-features flakes build .\#nixosConfigurations.this.config.system.build.qemuImage -L
    - ssh -F /root/.ssh/config  default@cloud-images.opt.provvedo.com mkdir -p /data/cloud-images
    - ssh -F /root/.ssh/config  default@cloud-images.opt.provvedo.com rm -rf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.*
    - scp -F /root/.ssh/config  ./result/nixos.qcow2 default@cloud-images.opt.provvedo.com:/data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2
    - ssh -F /root/.ssh/config  default@cloud-images.opt.provvedo.com ln -sf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2 /data/cloud-images/${IMAGE_NAME}-latest.qcow2
    - cp -r "$(readlink result)" output
    - ls -ltr


  artifacts:
    paths:
      - ./output
