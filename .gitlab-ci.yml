release:
  image: nixos/nix
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

  script:
    - nix --extra-experimental-features nix-command --extra-experimental-features flakes profile install nixpkgs#nodejs
    - nix --extra-experimental-features nix-command --extra-experimental-features flakes build .\#tarballImage -L
    - cp -r `readlink result` output
    - ls -ltr
    - npm install -g semantic-release @semantic-release/gitlab
    - npx semantic-release

  artifacts:
    paths:
      - ./output

