stages:
  - release
  - build

release:
  image: python:3.13
  stage: release
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $GL_TOKEN
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - pip install uv
    - uv pip install --system python-semantic-release==10.3.1
  script:
    - printenv
    - git checkout "$CI_COMMIT_REF_NAME"
    - semantic-release -vv version

  except:
    changes:
      - pyproject.toml
      - CHANGELOG.md

build:
  image: nixos/nix
  stage: build

  only:
    refs:
      - tags

  variables:
    PRIVATE_KEY: $ID_ED25519
    PUBLIC_KEY: $ID_ED25519_PUB
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

  script:
    - echo "Build!"
    - printenv
    - nix --extra-experimental-features nix-command --extra-experimental-features flakes build .\#tarballImage -L
    - cp -r `readlink result` output
    - ls -ltr

  artifacts:
    paths:
      - ./output
