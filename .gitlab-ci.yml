stages:
  - release
  - build

release:
  image: python:3.13
  stage: release
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $GL_TOKEN
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - pip install uv
    - uv pip install --system python-semantic-release==10.3.1
  script:
    - printenv
    - git checkout "$CI_COMMIT_REF_NAME"
    - semantic-release -vv version

  except:
    changes:
      - pyproject.toml
      - CHANGELOG.md

build:
  image: nixos/nix
  stage: build
  tags:
    - shell

  only:
    refs:
      - tags

  variables:
    IMAGE_NAME: nixos
    PRIVATE_KEY: $ID_ED25519
    PUBLIC_KEY: $ID_ED25519_PUB
    GIT_STRATEGY: clone
    GIT_DEPTH: 0

  script:
    - echo "Build!"
    - printenv
    - mkdir -p ~/.ssh
    - echo "$PRIVATE_KEY" > ~/.ssh/id_ed25519
    - echo "$PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
    - |
      cat <<EOF > ~/.ssh/config
      Host cloud-images.opt.provvedo.com
          UserKnownHostsFile=/dev/null
          StrictHostKeyChecking=no   
          IdentityFile ~/.ssh/id_ed25519
          User default
      Host *
          UserKnownHostsFile=/dev/null
          StrictHostKeyChecking=no   
          IdentityFile ~/.ssh/id_ed25519
      EOF
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/id_ed25519.pub
    - chmod 600 ~/.ssh/config
    - export CURRENT_DATE=$(date +%Y-%m-%d)
    # Debug SSH setup
    - echo "SSH config contents:"
    - cat ~/.ssh/config
    - echo "SSH key fingerprint:"
    - ssh-keygen -lf ~/.ssh/id_ed25519.pub
    # Test SSH connection with verbose output
    - ssh -v -o ConnectTimeout=10 default@cloud-images.opt.provvedo.com 'echo "SSH connection test successful"'


