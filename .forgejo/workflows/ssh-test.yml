name: ssh-test

# Manual-only diagnostic workflow: tests ONLY the CI SSH authentication to the
# cloud-images host. No nix builds. Run it from the Forgejo Actions UI.
on:
  workflow_dispatch:

env:
  SERVER_URL: cloud-images.opt.provvedo.com
  # Public key of the ci-ssh-key Terraform keypair (what the host *should*
  # authorize and what the secret's private key *should* derive to).
  EXPECTED_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDAcTDO3m86XA+o6ssBxybsNefuAJ56qytl+naecs+z3"

jobs:
  ssh-test:
    runs-on: native
    steps:
      - name: Write key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"

      - name: Inspect key file
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          echo "Line count:"; wc -l < "$SSH_DIR/id_ed25519"
          echo "Byte count:"; wc -c < "$SSH_DIR/id_ed25519"
          echo "First line:"; head -1 "$SSH_DIR/id_ed25519"
          echo "Last 2 lines (cat -A reveals trailing newlines / CRLF as ^M):"
          tail -2 "$SSH_DIR/id_ed25519" | cat -A

      - name: Derive and compare public key
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          if ! ssh-keygen -y -f "$SSH_DIR/id_ed25519" > "$SSH_DIR/id_ed25519.pub"; then
            echo "FATAL: private key failed to parse -> the secret's PEM is malformed."
            exit 1
          fi
          DERIVED="$(cat "$SSH_DIR/id_ed25519.pub")"
          echo "Derived from secret : $DERIVED"
          echo "Expected (terraform): $EXPECTED_PUBKEY"
          echo "Fingerprint:"; ssh-keygen -lf "$SSH_DIR/id_ed25519.pub"
          # Compare key material (field 2), ignoring any trailing comment field.
          if [ "$(echo "$DERIVED" | awk '{print $2}')" = "$(echo "$EXPECTED_PUBKEY" | awk '{print $2}')" ]; then
            echo "RESULT: secret MATCHES the terraform ci-ssh-key keypair."
          else
            echo "RESULT: secret does NOT match terraform ci-ssh-key -> the Forgejo SSH_PRIVATE_KEY secret is stale; re-apply ci-secret."
          fi

      - name: Connect (verbose)
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          cat > "$SSH_DIR/config" <<EOF
          Host ${SERVER_URL}
              UserKnownHostsFile=/dev/null
              StrictHostKeyChecking=no
              IdentityFile $SSH_DIR/id_ed25519
              IdentitiesOnly yes
              User default
          EOF
          chmod 600 "$SSH_DIR/config"
          echo "::group::ssh -vvv"
          ssh -vvv -o ConnectTimeout=15 -F "$SSH_DIR/config" default@${SERVER_URL} 'echo AUTH_OK; whoami; hostname' \
            && echo "RESULT: SSH AUTHENTICATION SUCCEEDED" \
            || echo "RESULT: SSH AUTHENTICATION FAILED (exit $?)"
          echo "::endgroup::"