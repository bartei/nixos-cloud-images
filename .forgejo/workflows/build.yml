name: build

# Builds every image on the native runner and publishes it to the private image
# server (cloud-images.opt.provvedo.com, public face cloud-images.provvedo.com).
# Triggered by v* tags. Tags are not created here: the GitHub repository
# github.com/bartei/nixos-cloud-images runs semantic-release and the monthly
# nixpkgs update, and its workflow mirrors main plus each new tag to this repo.
# Forgejo main is receive-only; do not push to it directly or the mirror push
# will stop fast-forwarding. See .github/github_design.md, "Two forges".

on:
  push:
    tags:
      - "v*"

env:
  SERVER_URL: cloud-images.opt.provvedo.com

jobs:
  images:
    # native:host runner – builds with the host's Nix (flakes already enabled).
    runs-on: native
    strategy:
      fail-fast: false
      matrix:
        version:
          - "25.05"
          - "25.11"
          - "26.05"
    env:
      IMAGE_NAME: nixos-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        # Pass the multiline key via env (not inline interpolation into the
        # script) so its PEM line structure is preserved; printf guarantees the
        # trailing newline OpenSSH requires.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # $HOME is unset on the native runner, so keep everything under the
          # workspace with absolute paths instead of relying on ~.
          SSH_DIR="$(pwd)/.ci-ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          # Fail fast with a clear error if the key is malformed, and
          # materialise the matching public key next to it.
          ssh-keygen -y -f "$SSH_DIR/id_ed25519" > "$SSH_DIR/id_ed25519.pub"
          cat > "$SSH_DIR/config" <<EOF
          Host ${SERVER_URL}
              UserKnownHostsFile=/dev/null
              StrictHostKeyChecking=no
              IdentityFile $SSH_DIR/id_ed25519
              User default
          EOF
          chmod 600 "$SSH_DIR/config"

      - name: Build and publish qcow2
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          if [ ! -d "./vm/${IMAGE_NAME}" ]; then
            echo "No vm image for ${IMAGE_NAME}; skipping."
            exit 0
          fi
          export CURRENT_DATE=$(date +%Y-%m-%d)
          nix build ./vm/${IMAGE_NAME}#image -L
          QCOW2=$(find -L ./result -type f -name '*.qcow2' | head -1)
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} mkdir -p /data/cloud-images
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} rm -rf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2
          scp -F "$SSH_DIR/config" "$QCOW2" default@${SERVER_URL}:/data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} ln -sf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2 /data/cloud-images/${IMAGE_NAME}-latest.qcow2

      - name: Build and publish ami vhd
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          if [ ! -d "./ami/${IMAGE_NAME}" ]; then
            echo "No ami image for ${IMAGE_NAME}; skipping."
            exit 0
          fi
          export CURRENT_DATE=$(date +%Y-%m-%d)
          nix build ./ami/${IMAGE_NAME}#image -L
          # The image framework may place the .vhd in a subdirectory of ./result.
          VHD=$(find -L ./result -type f -name '*.vhd' | head -1)
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} mkdir -p /data/ami
          # nix artifacts are read-only (0444); scp can't overwrite an existing
          # one, so remove the dated target first (matches the qcow2 step).
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} rm -rf /data/ami/${IMAGE_NAME}-${CURRENT_DATE}.vhd
          scp -F "$SSH_DIR/config" "$VHD" default@${SERVER_URL}:/data/ami/${IMAGE_NAME}-${CURRENT_DATE}.vhd
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} ln -sf /data/ami/${IMAGE_NAME}-${CURRENT_DATE}.vhd /data/ami/${IMAGE_NAME}-latest.vhd

      - name: Build and publish lxc template
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          # Not every version has an lxc template; skip the ones that don't.
          if [ ! -d "./lxc/${IMAGE_NAME}" ]; then
            echo "No lxc template for ${IMAGE_NAME}; skipping."
            exit 0
          fi
          export CURRENT_DATE=$(date +%Y-%m-%d)
          nix build ./lxc/${IMAGE_NAME}#image -L
          TARBALL=$(find -L ./result/tarball -type f -name '*.tar.xz' | head -1)
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} mkdir -p /data/lxc-templates
          # nix artifacts are read-only (0444); remove the dated target before scp.
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} rm -rf /data/lxc-templates/${IMAGE_NAME}-${CURRENT_DATE}.tar.xz
          scp -F "$SSH_DIR/config" "$TARBALL" default@${SERVER_URL}:/data/lxc-templates/${IMAGE_NAME}-${CURRENT_DATE}.tar.xz
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} ln -sf /data/lxc-templates/${IMAGE_NAME}-${CURRENT_DATE}.tar.xz /data/lxc-templates/${IMAGE_NAME}-latest.tar.xz