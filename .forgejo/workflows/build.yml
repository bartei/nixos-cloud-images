name: build

on:
  push:
    tags:
      - "v*"

env:
  SERVER_URL: cloud-images.opt.provvedo.com

jobs:
  qemu-25-05:
    # native:host runner – builds with the host's Nix (flakes already enabled).
    runs-on: native
    env:
      IMAGE_NAME: nixos-25.05
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          # $HOME is unset on the native runner, so keep everything under the
          # workspace with absolute paths instead of relying on ~.
          SSH_DIR="$(pwd)/.ci-ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          cat > "$SSH_DIR/config" <<EOF
          Host ${SERVER_URL}
              UserKnownHostsFile=/dev/null
              StrictHostKeyChecking=no
              IdentityFile $SSH_DIR/id_ed25519
              User default
          EOF
          chmod 600 "$SSH_DIR/config"

      - name: Build and publish qcow2
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          export CURRENT_DATE=$(date +%Y-%m-%d)
          nix build ./${IMAGE_NAME}#nixosConfigurations.this.config.system.build.qemuImage -L
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} mkdir -p /data/cloud-images
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} rm -rf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.*
          scp -F "$SSH_DIR/config" ./result/nixos.qcow2 default@${SERVER_URL}:/data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} ln -sf /data/cloud-images/${IMAGE_NAME}-${CURRENT_DATE}.qcow2 /data/cloud-images/${IMAGE_NAME}-latest.qcow2

  ami:
    runs-on: native
    env:
      IMAGE_NAME: nixos-24.11
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          cat > "$SSH_DIR/config" <<EOF
          Host ${SERVER_URL}
              UserKnownHostsFile=/dev/null
              StrictHostKeyChecking=no
              IdentityFile $SSH_DIR/id_ed25519
              User default
          EOF
          chmod 600 "$SSH_DIR/config"

      - name: Build and publish ami vhd
        run: |
          SSH_DIR="$(pwd)/.ci-ssh"
          export CURRENT_DATE=$(date +%Y-%m-%d)
          nix build .#ami -L
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} mkdir -p /data/ami
          scp -F "$SSH_DIR/config" $(ls ./result/*.vhd) default@${SERVER_URL}:/data/ami/${IMAGE_NAME}-${CURRENT_DATE}.vhd
          ssh -F "$SSH_DIR/config" default@${SERVER_URL} ln -sf /data/ami/${IMAGE_NAME}-${CURRENT_DATE}.vhd /data/cloud-images/${IMAGE_NAME}-latest.vhd