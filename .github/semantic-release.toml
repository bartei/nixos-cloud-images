# python-semantic-release configuration for the GitHub pipeline.
#
# pyproject.toml holds the equivalent configuration for the Forgejo pipeline
# (remote type "gitea"). Both files must stay complete and independent; the
# GitHub workflow passes this one via the action's `config_file` input.
# See .github/github_design.md.

[semantic_release]
# No package version to bump: the project is images, not a Python package.
# semantic-release only updates CHANGELOG.md, commits, tags and creates the
# GitHub Release. Image assets are uploaded by the build jobs with `gh`.
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"

[semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[semantic_release.remote]
name = "origin"
type = "github"
token = { env = "GH_TOKEN" }
ignore_token_for_push = false

[semantic_release.publish]
upload_to_vcs_release = false
